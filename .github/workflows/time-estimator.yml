name: Test offline time estimator

on:
  push:
    paths:
      - 'TimeEstimator.py'
      - 'time_estimator_*.json'
      - 'scripts/validate_time_estimator.py'
      - 'scripts/analyze_cooldown_delays.py'
      - 'scripts/experiment_time_calibration.py'
      - 'scripts/experiment_gap_equations.py'
      - 'tests/test_time_estimator.py'
      - 'tests/test_time_calibration.py'
      - 'tests/test_time_gap_equations.py'
      - 'lib/exercises.ts'
      - '.github/workflows/time-estimator.yml'
  pull_request:
    paths:
      - 'TimeEstimator.py'
      - 'time_estimator_*.json'
      - 'scripts/validate_time_estimator.py'
      - 'scripts/analyze_cooldown_delays.py'
      - 'scripts/experiment_time_calibration.py'
      - 'scripts/experiment_gap_equations.py'
      - 'tests/test_time_estimator.py'
      - 'tests/test_time_calibration.py'
      - 'tests/test_time_gap_equations.py'
      - 'lib/exercises.ts'
      - '.github/workflows/time-estimator.yml'

permissions:
  contents: read

jobs:
  estimator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Test dependency-free estimator
        run: python3 -m unittest discover -s tests -p 'test_time*.py' -v
